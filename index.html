<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f5f2eb">
    <meta name="description" content="A quiet place to make and print procedural flowers, landscapes, drawings, fish, and maps.">
    <title>Painting</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=drawably-2">
  </head>
  <body>
    <main class="painting-app">
      <header class="painting-heading">
        <nav class="modes" aria-label="Painting type">
          <a id="flowers-link" href="./flowers/" data-mode="flowers" aria-current="page"><span class="tab-label">Flowers</span></a>
          <a id="landscapes-link" href="./landscapes/" data-mode="landscapes"><span class="tab-label">Landscapes</span></a>
          <a id="fish-link" href="./fish/" data-mode="fish"><span class="tab-label">Fish</span></a>
          <a id="maps-link" href="./maps/" data-mode="maps"><span class="tab-label">Maps</span></a>
        </nav>
        <div class="section-divider" aria-hidden="true"></div>
      </header>
      <section id="painting-panel" class="gallery" aria-labelledby="flowers-link" aria-busy="true">
        <div id="canvas-viewport" class="canvas-viewport" tabindex="0" role="group" aria-label="Artwork viewer" aria-describedby="zoom-help">
          <div class="artwork-frame flowers">
            <div id="artwork" class="artwork flowers"></div>
          </div>
        </div>
        <p id="zoom-help" class="sr-only">Pinch or scroll to zoom. Drag to move. Double-tap or double-click to reset the artwork. Zooming out stops at the initial size. With the viewer focused, use plus and minus to zoom, arrow keys to move, and zero to reset.</p>
        <div id="loading-indicator" role="status" aria-label="Generating painting"><span class="spinner-sketch" aria-hidden="true"></span></div>
        <p id="status" role="status" aria-live="polite"></p>
      </section>
      <footer class="painting-footer">
        <div class="section-divider" aria-hidden="true"></div>
        <p class="credit"><a id="painting-author" href="https://github.com/LingDong-/nonflowers" target="_blank" rel="noopener noreferrer"><span id="painting-author-name">Lingdong Huang</span></a><span aria-hidden="true"> · </span><time id="painting-date" datetime="2018-02-12">2018</time></p>
      <div class="actions" role="group" aria-label="Painting controls">
        <button type="button" id="regenerate" data-variant="scribble" title="Regenerate" disabled>
          <span>Regenerate</span>
        </button>
        <button type="button" id="download" data-variant="solid" title="Download" disabled>
          <span id="download-label">Download</span>
        </button>
        <button type="button" id="settings" title="Settings" aria-haspopup="dialog" aria-controls="settings-dialog" disabled>
          <span>Settings</span>
        </button>
      </div>
      </footer>
      <dialog id="settings-dialog" aria-labelledby="settings-title">
        <form method="dialog">
          <h2 id="settings-title">Settings</h2>
          <div class="setting-row"><label for="file-format">File type</label>
            <select id="file-format" name="format">
              <option value="pdf">PDF</option>
              <option value="png">PNG</option>
              <option value="svg">SVG</option>
            </select>
          </div>
          <div class="setting-row"><label for="orientation">Orientation</label>
            <select id="orientation" name="orientation">
              <option value="portrait">Portrait</option>
              <option value="landscape">Landscape</option>
            </select>
          </div>
          <div class="setting-row"><label for="page-size">Page size</label>
            <select id="page-size" name="paper">
              <option value="a4">A4</option>
              <option value="a3">A3</option>
            </select>
          </div>
          <label class="background-setting" for="add-background"><input id="add-background" type="checkbox" name="background"> Add background</label>
          <div class="dialog-actions"><button id="settings-done" value="done" data-variant="solid">Done</button></div>
        </form>
      </dialog>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
