<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f2eb">
    <meta name="description" content="A quiet place to make and print procedural flowers and landscapes. Artwork by Lingdong Huang.">
    <title>Painting</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23f7f7f3'/%3E%3Cpath d='M16 45 28 21 39 37 47 29 56 45Z' fill='%23666b5a'/%3E%3C/svg%3E">
  </head>
  <body>
    <main>
      <header class="painting-heading">
        <h1 id="painting-title">Nonflowers</h1>
        <span class="credit">by <a id="painting-author" href="https://github.com/LingDong-/nonflowers" target="_blank" rel="noopener noreferrer">Lingdong Huang</a></span>
      </header>
      <div class="modes" role="tablist" aria-label="Painting type">
        <button type="button" id="flowers-tab" role="tab" data-mode="flowers" aria-selected="true" aria-controls="painting-panel">Flowers</button>
        <button type="button" id="landscapes-tab" role="tab" data-mode="landscapes" aria-selected="false" aria-controls="painting-panel" tabindex="-1">Landscapes</button>
      </div>
      <section id="painting-panel" role="tabpanel" class="gallery" aria-labelledby="flowers-tab" aria-busy="true">
        <div id="artwork" class="artwork flowers"></div>
        <p id="status" role="status" aria-live="polite">Making your painting…</p>
      </section>
      <div class="actions">
        <button type="button" id="regenerate" disabled>
          <span>Regenerate</span>
        </button>
        <button type="button" id="download" disabled><span>Download</span></button>
        <button type="button" id="settings" aria-haspopup="dialog" aria-controls="settings-dialog" disabled>Settings</button>
      </div>
      <dialog id="settings-dialog" aria-labelledby="settings-title" aria-describedby="settings-note">
        <form method="dialog">
          <h2 id="settings-title">Settings</h2>
          <div class="setting-row"><label for="file-format">File type</label>
            <select id="file-format" name="format">
              <option value="pdf">PDF</option>
              <option value="png">PNG</option>
              <option value="svg">SVG</option>
            </select>
          </div>
          <div class="setting-row"><label for="orientation">Orientation</label>
            <select id="orientation" name="orientation">
              <option value="portrait">Portrait</option>
              <option value="landscape">Landscape</option>
            </select>
          </div>
          <div class="setting-row"><label for="page-size">Page size</label>
            <select id="page-size" name="paper">
              <option value="a4">A4</option>
              <option value="a3">A3</option>
            </select>
          </div>
          <p id="settings-note">Orientation and page size apply to PDFs.</p>
          <div class="dialog-actions"><button value="done" class="confirm">Done</button></div>
        </form>
      </dialog>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
